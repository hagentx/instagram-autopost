name: Autopilot — caption & schedule new selfies

on:
  push:
    paths:
      - "media/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ig-autopilot
  cancel-in-progress: false

jobs:
  caption:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install renderer dependency
        run: npm install --no-audit --no-fund

      - name: Caption + schedule new selfies
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          MEDIA_BASE_URL: ${{ vars.MEDIA_BASE_URL }}
          POST_DAYS: ${{ vars.POST_DAYS }}
          POST_TIME_UTC: ${{ vars.POST_TIME_UTC }}
          AUTOPILOT_REVIEW: ${{ vars.AUTOPILOT_REVIEW }}
        run: |
          # Manual runs are tests: use the next 30-minute slot today,
          # instead of pushing the test to the next daily publishing day.
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            SLOT=$(($(date -u +%s) / 1800 * 1800 + 1800))
            echo "POST_DAYS=$(date -u -d "@$SLOT" +%a | tr '[:lower:]' '[:upper:]')" >> "$GITHUB_ENV"
            echo "POST_TIME_UTC=$(date -u -d "@$SLOT" +%H:%M)" >> "$GITHUB_ENV"
            echo "Manual test slot: $(date -u -d "@$SLOT" '+%Y-%m-%d %H:%M UTC')"
          fi

          node src/autopilot.js

      - name: Commit rendered posts + queue
        run: |
          if [[ -n "$(git status --porcelain media/rendered content/)" ]]; then
            git config user.name "ig-autopost[bot]"
            git config user.email "actions@users.noreply.github.com"

            # Commit local changes before rebasing so the index is clean.
            git add media/rendered content/queue.json content/lines.json
            git commit -m "chore: captioned + scheduled new selfies [skip ci]"

            # Rebase the local commit on any newer remote commit, then push.
            git pull --rebase origin ${GITHUB_REF_NAME}
            git push
          else
            echo "No new posts to commit."
          fi
